  const container = document.getElementById('algorithmsContainer');
  let currentCards = [];
  
  function renderCards(filterText = "") {
    const lowerFilter = filterText.toLowerCase();
    const filtered = algorithms.filter(algo => 
      algo.name.toLowerCase().includes(lowerFilter) || 
      algo.type.toLowerCase().includes(lowerFilter) ||
      algo.shortDesc.toLowerCase().includes(lowerFilter)
    );
    
    container.innerHTML = "";
    if(filtered.length === 0) {
      container.innerHTML = `<div class="col-12 text-center py-5"><i class="bi bi-emoji-frown fs-1"></i><h4 class="mt-3">No matching algorithm found</h4><p>Try different keyword</p></div>`;
      return;
    }
    
    filtered.forEach((algo, idx) => {
      const col = document.createElement('div');
      col.className = 'col-12 col-sm-6 col-md-4 col-lg-3';
      col.innerHTML = `
        <div class="algorithm-card p-3" data-algo-index="${idx}" data-algo-name="${algo.name}">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="algo-type">${algo.type}</span>
            <i class="bi bi-lock-fill text-primary" style="font-size: 1.2rem;"></i>
          </div>
          <h5 class="fw-bold mt-2">${algo.name}</h5>
          <p class="text-muted small mb-2">${algo.shortDesc}</p>
          <div class="mt-2">
            <span class="card-badge"><i class="bi bi-info-circle-fill me-1"></i>Click for demo</span>
          </div>
          <hr class="my-2">
          <div class="small text-secondary fw-mono">
            <i class="bi bi-code-slash"></i> example snippet
          </div>
        </div>
      `;
      container.appendChild(col);
    });
    
    // add click listeners to newly created cards
    document.querySelectorAll('.algorithm-card').forEach(card => {
      card.addEventListener('click', (e) => {
        const idxAttr = card.getAttribute('data-algo-index');
        if(idxAttr !== null) {
          const originalIdx = parseInt(idxAttr);
          const algoName = card.getAttribute('data-algo-name');
          const realAlgo = algorithms.find(a => a.name === algoName);
          if(realAlgo) showModal(realAlgo);
        }
      });
    });
  }

  function showModal(algo) {
    const modalTitleElem = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBodyContent');
    modalTitleElem.innerText = algo.name;
    
    modalBody.innerHTML = `
      <div class="mb-3">
        <span class="badge bg-primary fs-6 p-2">${algo.type}</span>
        <p class="mt-3 lead">${algo.shortDesc}</p>
      </div>
      <div class="example-box mb-4">
        <div class="fw-bold mb-2"><i class="bi bi-diagram-3"></i> Practical Example</div>
        <pre class="mb-0" style="white-space: pre-wrap; font-family: monospace; background: transparent;">${algo.exampleDetail}</pre>
      </div>
      <div class="mb-3">
        <h6><i class="bi bi-lightbulb"></i> Technical Explanation</h6>
        <p>${algo.explanation}</p>
      </div>
      <div class="mb-3">
        <h6><i class="bi bi-globe2"></i> Real-World Usage</h6>
        <div class="alert alert-success" role="alert" style="background: #e8f5e9; border-left: 4px solid #2e7d32;">
          <i class="bi bi-check-circle-fill text-success me-2"></i>
          ${algo.realWorld || "Widely used in modern security systems and cryptographic protocols."}
        </div>
      </div>
      <div class="alert alert-secondary mt-2" role="alert">
        <i class="bi bi-shield-shaded"></i> <strong>Did you know?</strong> ${algo.name} ${
          algo.type.includes("Asymmetric") ? "uses key pairs (public/private)." : 
          algo.type.includes("Symmetric") ? "same key for encryption/decryption." :
          "offers unique cryptographic properties."
        } Modern systems often combine several methods.
      </div>
    `;
    
    const modal = new bootstrap.Modal(document.getElementById('algoModal'));
    modal.show();
  }
  
  const searchInput = document.getElementById('searchAlgo');
  searchInput.addEventListener('input', (e) => {
    renderCards(e.target.value);
  });
  
  renderCards("");
  
  const originalRender = renderCards;
  window.renderCards = renderCards;
</script>
